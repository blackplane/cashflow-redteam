# Experiment matrix: models x conditions x statements x repeats.
# Each cell is one agent run; results go to runs/<run_id>/results.jsonl

models:
  claude: { litellm_id: "anthropic/claude-sonnet-5-5", context_window: 1000000, max_tokens: 16000 }
  gpt5:   { litellm_id: "openai/gpt-5.1", context_window: 400000, max_tokens: 16000 }
  gemma3: { litellm_id: "ollama/gemma3:4b", context_window: 262144, max_tokens: 16000 }

# The four rows of the results table.
conditions:
  baseline:        { dataset: benign,   defense: none }
  attack:          { dataset: poisoned, defense: none }
  defense:         { dataset: benign,   defense: "${defense}" }   # measures utility cost / false positives
  attack_defense:  { dataset: poisoned, defense: "${defense}" }

# Defense(s) substituted into ${defense}. One table per defense, or "stacked" for all layers at once.
defenses: [spotlight, structured_reader, detector, egress_allowlist, invariants, stacked]

attack:
  objectives: [metric_hijack, exfiltration]   # see attacks/payloads.py
  strategies: [explicit, fragmented, fragmented_distributed]
  months: [1, 3, 6, 12]                        # context-length sweep (the paper's "filler" variable)

agent:
  max_turns: 40
  code_exec: none   # none | local | docker

repeats: 3          # LLM runs are non-deterministic; report mean +/- std
seed: 1234
